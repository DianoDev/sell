[PHP]
; Esconde versão do PHP
expose_php = Off

; Não mostrar erros ao usuário final
display_errors = Off
log_errors = On

; Upload de arquivos (alinhado com client_max_body_size do nginx)
file_uploads = On
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 10

variables_order = EGPCS
memory_limit = 512M

date.timezone = America/Cuiaba

; Previne session hijacking
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Código é imutável dentro da imagem — não precisa checar timestamps
opcache.validate_timestamps = 0
