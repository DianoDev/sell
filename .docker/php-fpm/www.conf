[www]
user = www
group = www-data

listen = 9000

pm = dynamic

; --- WORKERS (VPS compartilhado com o web-ftv: manter enxuto) ---
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Evita memory leak
pm.max_requests = 500

; Não deixar requisição travada
request_terminate_timeout = 60s

; --- LIMITES DE MEMÓRIA ---
php_admin_value[memory_limit] = 256M

; --- LOGS (saem no `docker logs sell-fpm`) ---
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Repassa as variáveis do env_file do compose para o PHP
clear_env = no
